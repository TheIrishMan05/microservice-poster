server:
  port: 8082

spring:
  application:
    name: event-service

  r2dbc:
    url: r2dbc:postgresql://postgres:5432/event_db
    username: ${DB_ADMIN}
    password: ${ADMIN_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://postgres:5432/event_db
    user: ${DB_ADMIN}
    password: ${ADMIN_PASSWORD}

event:
  inventory:
    default-seats-per-ticket-type: 20
  reservation:
    min-quantity: 1
    max-quantity: 50

openapi:
  server-url: http://localhost:8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
