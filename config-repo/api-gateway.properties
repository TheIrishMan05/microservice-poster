server.port=8080

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**,/api/notifications/**

spring.cloud.gateway.server.webflux.routes[1].id=event-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/events/**,/api/registrations/**,/api/ticket-types/**,/api/ticket-waitlist/**,/api/tags/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**,/api/tickets/**

spring.cloud.gateway.server.webflux.routes[3].id=user-service-api-docs
spring.cloud.gateway.server.webflux.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/v3/api-docs/user-service
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/v3/api-docs/user-service,/v3/api-docs

spring.cloud.gateway.server.webflux.routes[4].id=event-service-api-docs
spring.cloud.gateway.server.webflux.routes[4].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v3/api-docs/event-service
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/v3/api-docs/event-service,/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=order-service-api-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/v3/api-docs/order-service
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/v3/api-docs/order-service,/v3/api-docs

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposedHeaders=X-Total-Count,X-Request-Id

springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls-primary-name=user-service
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user-service
springdoc.swagger-ui.urls[1].name=event-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/event-service
springdoc.swagger-ui.urls[2].name=order-service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/order-service
