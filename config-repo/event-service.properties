server.port=8082
spring.application.name=event-service

spring.r2dbc.url=r2dbc:postgresql://postgres-event:5432/event_db
spring.r2dbc.username=${POSTGRES_USER:admin}
spring.r2dbc.password=${POSTGRES_PASSWORD:password}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.liquibase.url=jdbc:postgresql://postgres-event:5432/event_db
spring.liquibase.user=${POSTGRES_USER:admin}
spring.liquibase.password=${POSTGRES_PASSWORD:password}

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/