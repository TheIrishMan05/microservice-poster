server:
  port: 8082

spring:
  application:
    name: event-service
  
  r2dbc:
    url: r2dbc:postgresql://postgres-event:5432/event_db
    username: ${DB_ADMIN}
    password: ${ADMIN_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://postgres-event:5432/event_db
    user: ${DB_ADMIN}
    password: ${ADMIN_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/