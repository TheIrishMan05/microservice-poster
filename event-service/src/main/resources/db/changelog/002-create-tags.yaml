databaseChangeLog:
  - changeSet:
      id: 002-create-tags
      author: dev
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
        
        - createIndex:
            indexName: idx_tags_name
            tableName: tags
            columns:
              - column:
                  name: name