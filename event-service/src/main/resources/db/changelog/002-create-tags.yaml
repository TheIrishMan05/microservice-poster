databaseChangeLog:
  - changeSet:
      id: 002-create-event-tags
      author: dev
      changes:
        - createTable:
            tableName: event_tags
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: event_tags
            columnNames: event_id, tag_id
            constraintName: pk_event_tags