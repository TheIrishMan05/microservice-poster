spring:
  application:
    name: event-service
  
  config:
    import: optional:configserver:http://config-server:8888
  
  cloud:
    config:
      enabled: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

spring.liquibase:
  enabled: true
  change-log: classpath:db/changelog/db.changelog-master.yaml

event:
  inventory:
    default-seats-per-ticket-type: 20
  reservation:
    min-quantity: 1
    max-quantity: 50

openapi:
  server-url: http://localhost:8080