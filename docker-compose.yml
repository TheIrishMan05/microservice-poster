services:
  
  postgres-user:
    image: postgres:15-alpine
    container_name: db-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_USER_PORT}:5432"
    volumes:
      - pgdata-user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d user_db"]
      interval: 10s        
      timeout: 10s         
      retries: 10          
      start_period: 30s  
    networks:
      - poster-net

  postgres-event:
    image: postgres:15-alpine
    container_name: db-event
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_EVENT_PORT}:5432"
    volumes:
      - pgdata-event:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d event_db"]
      interval: 10s        
      timeout: 10s         
      retries: 10          
      start_period: 30s    
    networks:
      - poster-net

  postgres-order:
    image: postgres:15-alpine
    container_name: db-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_ORDER_PORT}:5432"
    volumes:
      - pgdata-order:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d order_db"]
      interval: 10s        
      timeout: 10s         
      retries: 10          
      start_period: 30s  
    networks:
      - poster-net


  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      SERVER_PORT: 8761
      JAVA_OPTS: "-Xmx256m"
    networks:
      - poster-net
    restart: on-failure

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "${CONFIG_PORT}:8888"
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///app/config-repo
      JAVA_OPTS: "-Xmx256m"
    volumes:
      - ./config-repo:/app/config-repo:ro
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - poster-net
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - poster-net
    restart: on-failure

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT}:8081"
    environment:
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: true
      
      JAVA_OPTS: "-Xmx512m"
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - poster-net
    restart: on-failure

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: event-service
    ports:
      - "${EVENT_SERVICE_PORT}:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-event:5432/event_db
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      
      SPRING_LIQUIBASE_URL: jdbc:postgresql://postgres-event:5432/event_db
      SPRING_LIQUIBASE_USER: ${POSTGRES_USER}
      SPRING_LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_CHANGELOG: classpath:db/changelog/db.changelog-master.yaml
      SPRING_LIQUIBASE_ENABLED: true
      
      JAVA_OPTS: "-Xmx512m"
    depends_on:
      postgres-event:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - poster-net
    restart: on-failure

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "${ORDER_SERVICE_PORT}:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order_db
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: true
      
      JAVA_OPTS: "-Xmx512m"
    depends_on:
      postgres-order:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      user-service:
        condition: service_started
      event-service:
        condition: service_started
    networks:
      - poster-net
    restart: on-failure


networks:
  poster-net:
    driver: bridge

volumes:
  pgdata-user:
  pgdata-event:
  pgdata-order: